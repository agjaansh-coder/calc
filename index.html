<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="calculator" role="application" aria-label="Simple calculator">
    <div class="display" id="display" aria-live="polite">0</div>

    <div class="keys" role="group" aria-label="Calculator keys">
      <!-- Row 1 -->
      <button class="key function" data-action="clear" aria-label="Clear">C</button>
      <button class="key function" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key operator" data-value="(" aria-label="Left parenthesis">(</button>
      <button class="key operator" data-value=")" aria-label="Right parenthesis">)</button>

      <!-- Row 2 -->
      <button class="key digit" data-value="7">7</button>
      <button class="key digit" data-value="8">8</button>
      <button class="key digit" data-value="9">9</button>
      <button class="key operator" data-value="/" aria-label="Divide">÷</button>

      <!-- Row 3 -->
      <button class="key digit" data-value="4">4</button>
      <button class="key digit" data-value="5">5</button>
      <button class="key digit" data-value="6">6</button>
      <button class="key operator" data-value="*" aria-label="Multiply">×</button>

      <!-- Row 4 -->
      <button class="key digit" data-value="1">1</button>
      <button class="key digit" data-value="2">2</button>
      <button class="key digit" data-value="3">3</button>
      <button class="key operator" data-value="-" aria-label="Subtract">−</button>

      <!-- Row 5 -->
      <button class="key digit wide" data-value="0">0</button>
      <button class="key digit" data-value=".">.</button>
      <button class="key operator" data-value="+" aria-label="Add">+</button>

      <!-- Row 6: equals -->
      <button class="key equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
